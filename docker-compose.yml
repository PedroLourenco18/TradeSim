services:

  # ── Banco de dados PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: meu_projeto_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"           # remova esta linha em produção se não precisar de acesso externo
    volumes:
      - postgres_data:/var/lib/postgresql/data          # dados persistentes
      - ./db/init:/docker-entrypoint-initdb.d           # ← scripts SQL executados na 1ª inicialização
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Aplicação Spring Boot ──────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meu_projeto_app
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - .env                  # ← todas as variáveis do .env são injetadas no container
    environment:
      # Garante que o Spring conecte no container do postgres pelo nome do serviço
      SPRING_DATASOURCE_URL:      jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy   # aguarda o postgres estar pronto

  pgadmin:
    image: dpage/pgadmin4
    container_name: meu_projeto_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: